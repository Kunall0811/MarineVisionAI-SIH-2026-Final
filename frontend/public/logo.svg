<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="mv-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a2f45"/>
      <stop offset="100%" stop-color="#04121c"/>
    </radialGradient>
    <linearGradient id="mv-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#mv-bg)" stroke="#22d3ee" stroke-opacity="0.45"/>

  <!-- sonar range rings -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="32" cy="32" r="7" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1"/>

  <!-- sweep wedge -->
  <path d="M32 32 L32 9 A23 23 0 0 1 53.9 25.5 Z" fill="url(#mv-sweep)"/>

  <!-- crossbars -->
  <line x1="32" y1="4" x2="32" y2="60" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="1"/>

  <!-- detected contact blip -->
  <circle cx="41" cy="21" r="2.6" fill="#f97316"/>
  <circle cx="41" cy="21" r="5.5" fill="none" stroke="#f97316" stroke-opacity="0.5" stroke-width="1"/>

  <!-- center hub -->
  <circle cx="32" cy="32" r="3" fill="#e2fbff"/>
</svg>
